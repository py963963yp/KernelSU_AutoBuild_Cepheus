name: PixelOS_build_kernel
env:
  KERNEL_SOURCE: 'https://github.com/py963963yp/kernel_xiaomi_cepheus_pixel'
  KERNEL_SOURCE_BRANCH: 'fifteen-kernelsu'
  KERNEL_DEFCONFIG: 'cepheus_resukisu_defconfig'
  KERNEL_NAME: 'pixelos-cepheus-15'
  
on:

  workflow_dispatch:
#   schedule:
#     - cron: '0 0 * * 0'    
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
        contents: write
    steps:
      - uses: actions/checkout@v3

      - name: download kernel source
        run: |
          cd $GITHUB_WORKSPACE && mkdir kernel_workspace && cd kernel_workspace
          git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

      - name: setup build kernel environment
        run: |
          
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp $GITHUB_WORKSPACE/patch/pixelOS_kernel/anykernel.sh $GITHUB_WORKSPACE/patch/pixelOS_kernel/build.sh $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
#      - name: add resukisu 
#        run: |
#          curl -LSs "https://raw.githubusercontent.com/py963963yp/ReSukiSU/main/kernel/setup.sh" | bash
#          sed -i 's/type_val_to_struct/type_val_to_struct_array/g' KernelSU/kernel/selinux/sepolicy.c  
    
#          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
#          sed -i "s/type_val_to_struct/type_val_to_struct_array/g" KernelSU/kernel/selinux/sepolicy.c
          
      - name: build kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm .git -R
          sudo bash build.sh
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M%S")" >> $GITHUB_ENV
          
      - name: release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          automatic_release_tag: "${{env.KERNEL_NAME}}-${{env.BUILD_TIME}}"
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            kernel_workspace/android-kernel/out/*.zip
            kernel_workspace/android-kernel/out/vmlinux
            kernel_workspace/android-kernel/kernel.tar.gz